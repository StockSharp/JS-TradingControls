name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: TradingControls
    steps:
      # Checked out into a named directory rather than the workspace root so the
      # grid can sit BESIDE it, which is where package.json says it is.
      - uses: actions/checkout@v4
        with:
          path: TradingControls

      # @stocksharp/grid is a `file:../Grids` dependency until it is published.
      # Without the sibling, `npm ci` still exits 0 -- it just leaves a dangling
      # symlink -- and the whole suite then fails on a module that "installed
      # fine", so the checkout is what makes a fresh clone buildable at all.
      - uses: actions/checkout@v4
        with:
          repository: StockSharp/Grids
          path: Grids

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TradingControls/package-lock.json

      # The grid's BUILT entry points, which is what this package's own dist
      # imports -- see build.mjs. Building it here is what lets the ESM load
      # check below mean anything.
      - name: Build the grid
        working-directory: Grids
        run: |
          npm ci
          npm run build

      - run: npm ci
      - run: npm test
      - run: npm run build

      # The one failure a passing test suite cannot see: everything here is
      # checked from source, so a dist that does not resolve its own imports
      # looks healthy until an adopter imports it.
      - name: The built ESM entry loads
        run: node -e "import('./dist/esm/index.js').then(m => console.log('dist/esm/index.js loaded,', Object.keys(m).length, 'exports'))"

      - name: Check package contents
        run: npm pack --dry-run
